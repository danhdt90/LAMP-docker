[xdebug]
; Disable Xdebug completely for local Docker CLI usage.
xdebug.mode=off
xdebug.start_with_request=no

; Keep remote debug settings disabled.
xdebug.client_host=127.0.0.1
xdebug.client_port=9003
xdebug.discover_client_host=0

; Disable logging to avoid noise when debugging is off.
xdebug.log=/tmp/xdebug.log
xdebug.log_level=0
xdebug.idekey=VSCODE
